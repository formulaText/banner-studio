# EXAMPLE ONLY — 統合版作成時の参考例。配信設定の正本は .github/workflows/pages.yml。
# 配信準備は承認済み。初回実行は別途本人の指示が必要。手順は ops/github-pages.md。
name: Approved Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - name: Deploy after explicit owner approval
        id: deployment
        uses: actions/deploy-pages@v4
