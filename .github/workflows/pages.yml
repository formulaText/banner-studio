name: Deploy app to GitHub Pages (manual)

# Preparation only: the first run requires a separate owner instruction.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the reviewed main branch may be published, even for manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Keep the existing public demo gate enabled; this is not authentication.
          VITE_GATE_ENABLED: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy after explicit owner instruction
        id: deployment
        uses: actions/deploy-pages@v4
